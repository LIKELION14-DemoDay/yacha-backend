# 테스트 전용 설정입니다. build.gradle 의 test 태스크가 이 프로필(test)을 활성화합니다.
#
# 이 파일이 없으면 테스트가 기본 프로필(local)로 떠서 개발용 DB 파일(./data/yacha.mv.db)에
# 직접 씁니다. 그러면 두 가지 문제가 생깁니다.
#   - 데이터를 넣는 테스트가 생기면 개발 중인 데이터와 섞입니다.
#   - local 설정의 AUTO_SERVER=TRUE 때문에 앱을 켜 둔 채로 테스트를 돌리면
#     같은 DB 파일을 동시에 쓰게 됩니다.
#
# 파일 이름이 application.yaml 이 아니라 application-test.yaml 인 것이 중요합니다.
# 테스트 클래스패스에 application.yaml 을 두면 main 의 application.yaml 을 통째로
# 가려버려서, 거기 있던 cors.allowed-origins 같은 공통 설정이 사라집니다.
# 프로필 파일은 main 의 application.yaml 위에 덮어쓰는 방식이라 필요한 것만 바꿀 수 있습니다.
spring:
  datasource:
    # 인메모리 DB. 테스트마다 격리되고 개발용 파일을 건드리지 않습니다.
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    hibernate:
      # 테스트가 끝나면 스키마째 사라집니다.
      ddl-auto: create-drop

jwt:
  # main 의 application.yaml 은 secret 에 기본값을 두지 않습니다(배포 실수를 빨리 드러내려고).
  # 그래서 환경변수 없이 테스트를 돌리면 컨텍스트 로딩이 실패하므로 여기서 랜덤 키를 넣습니다.
  secret: ${random.uuid}${random.uuid}
