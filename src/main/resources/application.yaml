spring:
  application:
    name: yacha-backend
  profiles:
    default: local
  jpa:
    # 트랜잭션 밖(뷰 렌더링 시점)까지 영속성 컨텍스트를 열어두지 않습니다.
    # 켜두면 요청 내내 DB 커넥션을 붙잡고 있어 커넥션 풀이 금방 마릅니다.
    open-in-view: false

  data:
    redis:
      # 리프레시 토큰 저장소입니다. 배포에서는 REDIS_HOST 로 컨테이너 이름을 넘깁니다.
      # 로컬 기본값(localhost:6379)은 docker run -d -p 6379:6379 redis:7-alpine 기준입니다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 비밀번호를 걸지 않은 Redis 면 비워 둡니다.
      password: ${REDIS_PASSWORD:}

jwt:
  # 기본값을 두지 않습니다. dev/prod에서 JWT_SECRET 을 빠뜨리면
  # 조용히 공개된 값으로 동작하는 대신 부팅이 실패하도록 합니다. (local 값은 application-local.yaml)
  secret: ${JWT_SECRET}
  # 액세스 토큰은 서버가 저장하지 않아서 발급 후에는 취소할 수 없습니다. 로그아웃·강제 차단이
  # 실제로 적용되기까지 걸리는 시간이 곧 이 값이라, 세션 대신 JWT 만 쓰기로 하면서 10분으로 줄였습니다.
  # 대신 재발급 호출이 잦아지므로 프론트는 401 재발급 요청을 하나로 묶어야 합니다.
  access-token-validity: 600000       # 10분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

auth:
  cookie:
    # 리프레시 토큰 쿠키 설정입니다. 기본값은 배포 기준(안전한 쪽)이고,
    # local 에서만 application-local.yaml 이 secure 를 false 로 덮어씁니다.
    secure: true
    # 프론트와 백엔드가 같은 도메인(yacha.com / api.yacha.com)이면 Lax 로 충분합니다.
    # 완전히 다른 도메인이면 None 으로 바꿔야 하고, 그때 secure 는 반드시 true 여야 합니다.
    same-site: Lax
    # 재발급 · 로그아웃에서만 쿠키가 필요합니다. 범위를 좁혀 노출 기회를 줄입니다.
    path: /api/v1/auth

springdoc:
  # API 문서는 기본이 꺼짐입니다. 운영에 API 목록이 공개되지 않도록 켜는 환경(local)에서만 true 로 덮어씁니다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  # 배포 시 CORS_ALLOWED_ORIGINS로 덮어쓰세요. 와일드카드(*) 사용 가능.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
