spring:
  application:
    name: yacha-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    # 켜두면 요청 내내 DB 커넥션을 붙잡고 있어 커넥션 풀이 금방 마름
    open-in-view: false

  data:
    redis:
      # 리프레시 토큰 저장소
      # 배포에서는 REDIS_HOST로 컨테이너 이름을 넘김
      # 로컬 기본값(localhost:6379)은 docker run -d -p 6379:6379 redis:7-alpine 기준
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 비밀번호를 걸지 않은 Redis면 비워둠
      password: ${REDIS_PASSWORD:}

server:
  # 운영은 서버의 프록시가 HTTPS 를 받아 앱(127.0.0.1:8080)으로 넘겨서, 앱이 보는 접속 IP 는 모두 프록시 주소임
  # 프록시가 붙인 X-Forwarded-For · X-Forwarded-Proto 로 실제 클라이언트 IP · https 여부를 읽음 (이메일 중복 확인의 IP 제한)
  # native 는 Tomcat 이 처리하고, 내부 주소(127.x · 10.x · 172.16~31.x · 192.168.x)에서 온 헤더만 믿음
  # 그래서 외부에서 헤더를 꾸며 보내도, 프록시가 마지막에 붙인 실제 IP를 씀
  # 프록시 없이 직접 띄우는 로컬에서는 헤더가 없어 아무 영향 없음
  forward-headers-strategy: native

jwt:
  # 기본값을 두지 않음
  secret: ${JWT_SECRET}
  # 액세스 토큰은 서버가 저장하지 않아서 발급 후에는 취소할 수 없음
  # 세션 대신 JWT만 쓰기로 하면서 10분으로 줄임
  # 대신 재발급 호출이 잦아지므로 프론트는 401 재발급 요청을 하나로 묶어야 함
  access-token-validity: 600000       # 10분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

auth:
  password-reset:
    # 인증번호 확인 뒤 받는 재설정 토큰의 유효시간. 새 비밀번호를 정하는 화면 하나만 남아서 짧게 둠 (10/5)
    token-ttl: 10m
    # 같은 이메일로 다시 보낼 수 있을 때까지의 간격. 남의 메일함에 계속 보내는 것을 막음 (팀 결정)
    send-interval: 1m
    # 메일로 보낸 인증번호 유효시간. 화면 타이머와 같음 (와이어프레임 10/5)
    code-ttl: 3m
    # 인증번호를 틀릴 수 있는 횟수. 넘기면 다시 요청해야 함. 6자리 + 5번이면 맞힐 확률 0.0005%
    max-code-attempts: 5
    # 틀린 횟수를 failure-window 동안 두 단계로 셈. 인증번호를 새로 받아도 이어서 셈
    # 위 5번만으로는 1분마다 새로 요청해 하루 수천 번 대입할 수 있어서 둠
    #   ip-failure-limit    이메일 하나를 한 IP가 틀릴 수 있는 횟수 (인증번호 2개 분량)
    #                       IP마다 따로 세서, 남이 일부러 틀려도 본인(다른 IP)은 막히지 않음
    #   email-failure-limit 이메일 하나를 모든 IP가 합쳐서 틀릴 수 있는 횟수. IP를 바꿔 가며 대입하는 것을 막음
    ip-failure-limit: 10
    email-failure-limit: 100
    failure-window: 24h
    # 한 IP가 인증번호 메일을 요청할 수 있는 횟수
    # 이메일별 간격(send-interval)만 있으면 이메일을 바꿔 가며 대량으로 요청해 Redis · DB 에 부하를 줄 수 있어서 둠
    request-ip-limit:
      max-requests: 10
      window: 10m
    # 한 IP가 인증번호를 확인할 수 있는 횟수. 한 IP에서 여러 이메일을 돌아가며 대입하는 것을 늦춤
    verify-ip-limit:
      max-requests: 30
      window: 10m

  email-check:
    # 회원가입 이메일 중복 확인을 한 IP가 window 안에 부를 수 있는 횟수
    # 학교 · 행사장 와이파이처럼 여러 명이 같은 IP로 가입할 수 있어 넉넉하게 둠
    max-requests: 30
    window: 1m

  guest-cleanup:
    # 만든 지 이만큼 지났고 리프레시 토큰도 없는 게스트를 지움 (10/2 회의). 리프레시 토큰 수명과 맞춤
    inactive-after: 14d
    # 한 트랜잭션에서 지우는 최대 수
    batch-size: 500
    # 매일 새벽 4시 (초 분 시 일 월 요일)
    cron: "0 0 4 * * *"

  cookie:
    # 리프레시 토큰 쿠키 설정
    # local에서만 application-local.yaml이 secure를 false로
    secure: true
    # 프론트와 백엔드가 같은 도메인(yacha.com / api.yacha.com)이면 Lax 로 충분함
    # 완전히 다른 도메인이면 None 으로 바꿔야 하고, 그때 secure 는 반드시 true
    same-site: Lax
    # 재발급 · 로그아웃에서만 쿠키가 필요함
    path: /api/v1/auth

oauth:
  # 소셜 로그인 id_token 검증용. clientId 는 프론트 SDK 에 넣는 값과 같아야 합니다(토큰의 aud 검사).
  # 비밀 값은 아니지만 환경마다 달라서 환경변수로 뺐습니다. 값이 없으면 그 공급자는 비활성화됩니다.
  google:
    # 웹 · iOS · Android 클라이언트 ID 가 각각 다릅니다. 쉼표로 여러 개를 넣을 수 있습니다.
    client-ids: ${GOOGLE_CLIENT_IDS:}
    # 구글은 스킴이 없는 형태도 쓸 수 있다고 안내합니다.
    issuer-uris: https://accounts.google.com,accounts.google.com
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  kakao:
    # 카카오는 앱의 REST API 키입니다. (프론트가 쓰는 JavaScript 키가 아닙니다)
    # 따로 넣지 않으면 KAKAO_REST_API_KEY 를 씁니다. 모바일 앱이 붙으면 네이티브 앱 키를 쉼표로 추가합니다.
    client-ids: ${KAKAO_CLIENT_IDS:${KAKAO_REST_API_KEY:}}
    issuer-uris: https://kauth.kakao.com
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
  kakao-code:
    # 웹 카카오 로그인(/auth/social/kakao)에서 인가 코드를 id_token 으로 바꿀 때 씁니다.
    # 콘솔에서 OpenID Connect 를 켜야 응답에 id_token 이 들어 있습니다.
    client-id: ${KAKAO_REST_API_KEY:}
    # 콘솔에서 Client Secret 을 켰을 때만 넣습니다. 비밀 값이라 저장소에 적지 마세요.
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
  google-code:
    # 웹 구글 로그인(/auth/social/google)에서 인가 코드를 id_token 으로 바꿀 때 씁니다.
    # 웹 클라이언트 ID 하나만 넣습니다. 따로 넣지 않으면 GOOGLE_CLIENT_IDS 를 씁니다.
    # (iOS · Android 클라이언트 ID 가 GOOGLE_CLIENT_IDS 에 추가되면 GOOGLE_CLIENT_ID 를 따로 넣어야 합니다)
    client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_IDS:}}
    # 비밀 값이라 저장소에 적지 마세요. 없으면 /auth/social/google 은 UNSUPPORTED_PROVIDER 입니다.
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token


mail:
  # 운영 메일 발송 (SMTP, 비밀번호 재설정 인증번호 · 소셜 계정 안내)
  # host 가 비어 있으면 보내지 않고 기동 로그에 경고만 남김. local · test 는 로그로 대신함
  # SES 의 SMTP 계정이든 Gmail 앱 비밀번호든 이 값만 바꾸면 됨. 비밀번호는 저장소에 적지 마세요
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  # 보내는 주소. SES 는 인증한 도메인의 주소, Gmail 은 그 Gmail 주소여야 함
  from: ${MAIL_FROM:}
  from-name: 야차철학
  # 메일 서버가 멈춰도 발송 스레드(mail-)가 오래 묶이지 않게 함
  connection-timeout: 5s
  timeout: 10s
game:
  # 토론 중 채팅 · 주장 · 반론은 서버 메모리에만 둡니다 (명세 1-5)
  # 채팅 한 건의 글자 수 상한 (이모지도 한 글자)
  chat-max-length: 100
  # 참가자 한 명이 한 게임에서 보낼 수 있는 채팅 수 (공개된 주장 · 반론 제외)
  max-chats-per-participant: 200
  # PREP 에 제출하는 주장의 글자 수 상한
  argument-max-length: 200
  # REBUTTAL 에 제출하는 반론의 글자 수 상한
  rebuttal-max-length: 250
  # 랜덤 방 대기 타이머 (created_at 기준)
  wait:
    # 방장에게 WAIT_PROMPT("봇전으로 시작하시겠습니까?")를 보내는 간격
    prompt-interval: 30s
    # 대기 상한. 지나면 방을 취소하고 WAIT_EXPIRED 를 보냄
    limit: 5m
    # 주기 정리 간격. 상한보다 이만큼 더 지났는데도 대기 중인 방(만료 작업 · 타이머 등록 실패)을 취소함
    sweep-interval: 1m
  # 진행 중 게임 (started_at 기준)
  in-progress:
    # 주기 정리 간격. 시간표(260초)보다 이만큼 더 지났는데도 진행 중인 게임(종료 작업 · 게임 생성 실패)을 끝냄
    sweep-interval: 1m
  # 봇전의 봇 발언 (주장 · 반론 제출, 채팅 대답)
  bot:
    # 한 게임에서 봇이 보내는 채팅 수 상한 (첫마디 포함)
    max-replies: 30
    # 사람의 마지막 말 뒤 대답까지
    reply-delay: 3s
    # 채팅이 열린 뒤(143초) 사람이 조용하면 봇이 먼저 한 번 말하기까지
    first-message-delay: 10s
    # 주장 · 반론 재시도 대기. 실패할 때마다 두 배(상한 retry-backoff-max)로 늘리며 작성 구간이 끝날 때까지 다시 시도
    retry-backoff: 1s
    retry-backoff-max: 8s
    # 채팅 대답이 실패하면 이만큼 뒤 한 번 다시 시도. 또 실패하면 준비된 문장으로 대답
    reply-retry-delay: 1s
    # 주장 · 반론을 끝내 못 써 실패 글이 공개된 뒤 게임을 무효(ABORTED)로 끝내기까지
    failure-end-delay: 5s
  # 힌트 (매칭 직후 사람 참가자마다 만듦, PREP 60초 안이 목표)
  hint:
    # 최대 시도 횟수. 모두 실패하면 FAILED 로 두고 힌트 없이 진행
    max-attempts: 2
    # 재시도 전 대기 시간
    retry-backoff: 1s
  # 게임 중 연결 끊김
  disconnect:
    # 이탈 유예. 이 안에 토론방을 다시 구독하면 복귀하고, 지나면 몰수패 (FORFEIT)
    grace: 10s
  # 판정 (260초에 채팅이 끝나면 시작)
  judge:
    # 판정 한 번의 최대 시도 횟수. 모두 실패하면 FAILED
    max-attempts: 3
    # 첫 재시도 전 대기 시간. 다음 재시도부터 두 배 (1초 → 2초). 429 · 5xx 가 이어질 때 바로 다시 때리지 않게
    retry-backoff: 1s
    # FAILED 뒤 /result 를 다시 부를 때 재판정하는 횟수. 다 쓰면 FAILED 를 그대로 줌 (폴링마다 LLM 을 부르지 않게)
    max-rejudges: 2
    # 결과 화면 보관 시간. 지나면 점수 · 요약은 지우고 승패만 남음
    result-retention: 10m

springdoc:
  # 기본값은 비활성화하고, local 및 데모 기간의 prod 프로필에서 필요한 경우 명시적으로 활성화한다.
  # prod의 Swagger 접근은 Nginx Basic Auth로 제한한다.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  # 배포 시 CORS_ALLOWED_ORIGINS로 덮어쓰세요!
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

liner:
  base-url: https://platform.liner.com
  api-key: ${LINER_API_KEY:}
  model: ${LINER_MODEL:liner-mark}

ai:
  # 힌트 키워드 · 봇 · 판정 구현 선택. stub 은 AI 연동 전까지 쓰는 임시 구현 (#76)
  mode: ${AI_MODE:stub}

philosophy:
  generation:
    # 다음 주 1분 철학 글을 만드는 시각 (#98). 목요일에 만들어 두고 금 · 주말에 검토 · 승인 → 월요일에 한꺼번에 공개
    cron: "0 0 10 * * THU"
    # 한 주에 공개하는 글 편수. 주제 하나가 한 편
    topics-per-week: 5
    # 글 한 편의 최대 시도 횟수. AI 호출 실패와 형식이 맞지 않는 응답 모두 한 번으로 셈
    max-attempts: 3
    # 첫 재시도 전 대기 시간. 다음 재시도부터 두 배 (2초 → 4초)
    retry-backoff: 2s

topic:
  seed:
    # 서버가 뜰 때마다 DB 의 주제를 topics/topics.json 과 맞춘다 (#54). 테스트에서는 끈다
    enabled: true

spectate:
  # 관전 스위치. 관전은 사용하지 않아(10/5) 꺼 둔다. 켜면 진행 중인 랜덤 사람전을 참가자가 아니어도 볼 수 있다
  enabled: false

storage:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    profile-prefix: profiles
    presigned-url-validity: 1h

# Add to src/main/resources/application.yaml (replace the older adsense: block).
adsense:
  enabled: ${ADSENSE_ENABLED:false}
  client-id: ${ADSENSE_CLIENT_ID:}
  client-secret: ${ADSENSE_CLIENT_SECRET:}
  redirect-uri: ${ADSENSE_REDIRECT_URI:http://localhost:8080/api/v1/adsense/oauth/callback}
  expected-account-name: ${ADSENSE_EXPECTED_ACCOUNT_NAME:}
  token-encryption-key: ${ADSENSE_TOKEN_ENCRYPTION_KEY:}
  cookie-secure: ${ADSENSE_COOKIE_SECURE:true}
