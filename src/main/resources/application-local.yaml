spring:
  datasource:
    # H2 를 파일 모드로 사용
    # ./data/yacha.mv.db 파일 하나에 저장 (.gitignore 에 추가)
    url: jdbc:h2:file:./data/yacha;AUTO_SERVER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      # local 전용, 엔티티 고치면 테이블에 반영해 주되, 기존 데이터는 남김
      # 운영(dev/prod)에서는 validate 또는 none 이어야 함
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # http://localhost:8080/h2-console 에서 테이블을 직접 볼 수 있음
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  # 로컬에서만 Swagger UI(/swagger-ui.html)를 켬
  # 기본값은 application.yaml 에서 꺼짐
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

auth:
  cookie:
    # 로컬은 http 라서 Secure 쿠키를 브라우저가 저장하지 않음
    secure: false

jwt:
  # 로컬 전용, 앱을 시작할 때마다 새로 만드는 랜덤 키
  secret: ${random.uuid}${random.uuid}
