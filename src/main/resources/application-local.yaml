springdoc:
  # 로컬에서만 Swagger UI(/swagger-ui.html)를 켭니다. 기본값은 application.yaml 에서 꺼짐입니다.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

jwt:
  # 로컬 전용. 앱을 시작할 때마다 새로 만드는 랜덤 키입니다.
  #
  # 고정 값을 저장소에 두지 않는 이유: 기본 프로필이 local 이라, 배포에서 프로필 지정을 빠뜨리면
  # 저장소에 공개된 키로 떠서 누구나 ADMIN 토큰을 위조할 수 있습니다.
  # 랜덤 키면 그 실수가 나도 위조할 수 없습니다.
  #
  # 재시작하면 기존 토큰이 무효가 되므로 다시 로그인(게스트 발급)해야 합니다.
  # JwtProperties 한 곳에서만 읽어야 합니다. 다른 곳에서 또 읽으면 서로 다른 키를 받습니다.
  secret: ${random.uuid}${random.uuid}
