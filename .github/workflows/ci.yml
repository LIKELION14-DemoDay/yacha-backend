name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew clean build
      - name: Prepare boot JAR
        run: |
          set -euo pipefail
          mkdir -p dist
          jar_path=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)
          test -n "$jar_path"
          cp "$jar_path" dist/app.jar
          test -s dist/app.jar
      - name: Upload JAR for deployment
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: dist/app.jar
          if-no-files-found: error
          retention-days: 7
      - name: Check deployment script syntax
        run: bash -n scripts/deploy-jar.sh

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload JAR to existing private S3 bucket
        run: |
          set -euo pipefail
          : "${DEPLOY_ARTIFACT_BUCKET:?Set DEPLOY_ARTIFACT_BUCKET repository variable}"
          test -s dist/app.jar
          (cd dist && sha256sum app.jar > app.jar.sha256)
          prefix="s3://${DEPLOY_ARTIFACT_BUCKET}/ci-jars/yacha-backend/${GITHUB_SHA}"
          aws s3 cp dist/app.jar "${prefix}/app.jar" --sse AES256 --only-show-errors
          aws s3 cp dist/app.jar.sha256 "${prefix}/app.jar.sha256" --sse AES256 --only-show-errors
      - name: Deploy to EC2 with SSM
        run: |
          set -euo pipefail
          remote_command=$(cat <<EOF_REMOTE
          set -eu
          exec 9>/var/lock/yacha-deploy.lock
          flock -n 9 || { echo 'Another deploy is active'; exit 1; }
          sudo -u ec2-user git -C /home/ec2-user/yacha-backend fetch origin main
          sudo -u ec2-user git -C /home/ec2-user/yacha-backend reset --hard ${GITHUB_SHA}
          bash /home/ec2-user/yacha-backend/scripts/deploy-jar.sh ${GITHUB_SHA} ${DEPLOY_ARTIFACT_BUCKET}
          EOF_REMOTE
          )
          parameters=$(jq -nc --arg cmd "$remote_command" '{commands:[$cmd], executionTimeout:["900"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy JAR ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query Command.CommandId --output text)
          echo "SSM command ID: $command_id"

          for attempt in {1..180}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "Deploy: $status"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text || true
                exit 1 ;;
            esac
            sleep 5
          done
          echo 'Deploy poll timed out' >&2
          exit 1
