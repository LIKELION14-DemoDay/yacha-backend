# CodeRabbit 설정 — https://docs.coderabbit.ai/reference/configuration
language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        Spring Boot 3 / Java 17 백엔드. 공통으로 확인한다.
        [예외 · 응답]
        - 사용자 요청 경로에서 unchecked 예외(IllegalStateException 등)가 새어 500 이 나지 않는지. 서비스에서 BusinessException + 에러 코드로 바꾼다.
        - 5xx 는 BusinessException(code, cause) 로 원인을 남긴다.
        - 응답은 ApiResponse { success, data, error, traceId } 형식. 엔티티를 응답으로 직접 반환하지 않는다.
        [시간]
        - 현재 시각은 LocalDateTime.now() 가 아니라 LocalDateTime.now(clock).
        - 타임존은 서버 · DB · JVM 모두 Asia/Seoul(KST) 로 통일한다. UTC 전환은 제안하지 않는다.
        [보안]
        - 채팅 본문 · 토큰 · 재설정 링크 같은 비밀 값을 로그와 예외 메시지에 넣지 않는다.
        - API 키 · 비밀 값은 환경변수로만 다룬다.
        [설정]
        - 필수 설정값이 없거나 0 이면 부팅이 실패해야 한다(@Validated, @Positive 등). 조용히 0 으로 바인딩되면 안 된다.
        [구조]
        - 호출 방향은 controller → service → repository. 다른 도메인 데이터는 그 도메인의 service 로 가져온다.
        - global 은 domain 을 참조하지 않는다. infra 는 외부 API 요청 · 응답 변환만 둔다.
        - PR 범위 밖의 코드나 "왜 이렇게 했는지" 설명 주석을 지우지 않았는지 본다.

    - path: "src/main/java/**/domain/session/**"
      instructions: |
        토론 세션 · 실시간 게임 코드.
        - 세션 상태 전환은 DebateSessionRepository 의 조건부 UPDATE(startIfWaiting, finishIfInProgress 등)로만 한다. 반환값이 1 인 쪽만 판정 · 알림 등 후속 처리를 한다.
        - 벌크 UPDATE 뒤에는 영속성 컨텍스트가 비워진다. 이전에 조회한 엔티티는 준영속이므로 값이 필요하면 findById 로 다시 읽고, FK 로만 쓰면 getReferenceById 를 쓴다. updatedAt 은 쿼리에서 직접 넣는다.
        - Game 메모리 상태는 synchronized (game) { append → 전송 } 처럼 같은 락 안에서 전송해 seqNo 순서를 지킨다.
        - 메시지 수 같은 상한은 게임 전체가 아니라 참가자 단위로 둔다.
        - 구간은 저장하지 않고 DebatePhase.at(startedAt, now) 로 계산한다.
        - 관전은 진행 중인 랜덤 사람전만 허용한다. 친구 방 · 봇전은 비공개다. 종료된 세션의 메시지가 조회되지 않는지 본다.

    - path: "src/main/java/**/global/security/**"
      instructions: |
        인증 · 인가 코드.
        - STOMP 목적지는 허용 목록 방식. SUBSCRIBE 는 /user/queue/** 와 권한 검사를 통과한 토론방만, SEND 는 /app/** 만 허용한다.
        - 필터 · 인터셉터에서 예외를 밖으로 던지지 않는다. GlobalExceptionHandler 가 잡지 못하므로 인증 실패(401)로 처리한다.
        - SecurityConfig 의 공개 경로(PUBLIC_ENDPOINTS)가 늘어나면 꼭 필요한지 확인한다.

    - path: "src/main/java/**/domain/auth/**"
      instructions: |
        인증 도메인.
        - 소셜 로그인은 같은 이메일이라도 기존 계정에 자동 연결하지 않는다.
        - 리프레시 토큰은 사용자당 1개. 새 토큰을 발급하면 이전 토큰(재설정 토큰 포함)은 무효가 되어야 한다.
        - 개발용 구현(로그 메일 발송 등)은 @Profile 로 local · test 에서만 등록한다.

    - path: "src/main/java/**/{repository,service}/**"
      instructions: |
        트랜잭션 · JPA.
        - UNIQUE 위반이 날 수 있는 저장은 saveAndFlush / flush 로 바로 드러내 BusinessException 으로 바꾼다.
        - 위반 뒤 기존 행을 찾아 정상 반환하지 않는다. 트랜잭션이 rollback-only 가 되어 커밋 때 500 이 난다.
        - open-in-view 가 꺼져 있다. 서비스 밖에서 LAZY 로딩을 하지 않는다. N+1 쿼리를 확인한다.
        - enum 컬럼은 @Enumerated(STRING) 과 @JdbcTypeCode(VARCHAR) 를 함께 쓴다.

    - path: "src/main/java/**/dto/**"
      instructions: |
        요청 검증.
        - BCrypt 로 들어가는 값은 @Size 가 아니라 @MaxBytes(72) 로 검증한다. 한글은 한 글자가 3바이트다.
        - Redis 키나 DB 컬럼에 들어가는 문자열은 길이를 제한한다(이메일 255자).

    - path: "src/main/java/**/infra/**"
      instructions: |
        외부 API(LLM · LINER) 클라이언트.
        - 연결 · 응답 타임아웃을 반드시 둔다. RestClient.builder() 는 기본 타임아웃이 없다.
        - 호출은 @Transactional 밖에서 한다. 응답이 안 오면 톰캣 워커와 DB 커넥션을 붙잡는다.
        - 비즈니스 로직은 두지 않는다.

    - path: "src/test/**"
      instructions: |
        테스트는 H2 와 test 프로필로 돈다(Redis 는 인메모리 구현).
        - 실제 동작을 검증하는지, 실패 · 경계 · 동시 요청 케이스가 빠지지 않았는지 본다.
        - 시각은 Clock.fixed 로 고정한다.

chat:
  auto_reply: true
